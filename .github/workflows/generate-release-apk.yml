name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Release Keystore
        run: |
          mkdir -p gpslogger/keystore
          keytool -genkeypair -v -keystore gpslogger/keystore/your_signing_keystore.jks \
            -alias gpslogger -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "gpslogger123" -keypass "gpslogger123" \
            -dname "CN=Danilo, OU=GPSLogger, O=Personal, L=City, ST=State, C=BR"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: gpslogger
          SIGNING_KEY_PASSWORD: gpslogger123
          SIGNING_STORE_PASSWORD: gpslogger123

      - name: Copy Release APK
        run: |
          mkdir -p release-output
          cp gpslogger/build/outputs/apk/release/gpslogger-release.apk release-output/gpslogger-${{ github.ref_name }}.apk

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpslogger-release-apk
          path: release-output/gpslogger-${{ github.ref_name }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-output/gpslogger-${{ github.ref_name }}.apk
          name: GPSLogger ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
